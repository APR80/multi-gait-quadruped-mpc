python-interpreter = "/home/pooya/micromamba/envs/jax_cpu/bin/python"

# Only report type errors inside functions that carry annotations.
check-unannotated-defs = false

# Compiled extension modules with no .pyi stubs -> Any instead of errors,
# e.g. ["Sofa.*"] for SOFA's pybind11 bindings.
ignore-missing-imports = []

[errors]
# Renaming a parameter of an overridden method is legal at runtime.
bad-override-param-name = false
